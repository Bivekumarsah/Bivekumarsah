<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-label="Bivek Kumar Sah, founder and software developer: premium dark GitHub profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1728"/><stop offset="0.55" stop-color="#0b1221"/><stop offset="1" stop-color="#111e31"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#4bd7cb"/><stop offset="1" stop-color="#79a9ff"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#50d9ca" stop-opacity=".75"/><stop offset="1" stop-color="#50d9ca" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#52c8ce" stop-opacity=".18"/><stop offset="1" stop-color="#52c8ce" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#5f7797" stroke-opacity=".12" stroke-width="1"/></pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="390" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="390" fill="url(#bg)"/>
    <rect width="1280" height="390" fill="url(#grid)"/>
    <circle cx="980" cy="165" r="380" fill="url(#glow)"/>
    <path d="M0 0H1280" stroke="#75c4d1" stroke-opacity=".25" stroke-width="2"/>
    <rect x="48" y="47" rx="14" width="250" height="36" fill="#12343d" stroke="#51d1c5" stroke-opacity=".40"/>
    <circle cx="68" cy="65" r="5" fill="#4ad8c6"/>
    <text x="85" y="71" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#a8f4e6" letter-spacing="1.7">BUILDING IN NEPAL</text>
    <text x="49" y="162" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" fill="#f1f6ff" letter-spacing="-1.4">BIVEK KUMAR</text>
    <text x="49" y="235" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" fill="url(#accent)" letter-spacing="-1.4">SAH<tspan fill="#f6bb75">.</tspan></text>
    <text x="52" y="284" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#ccd7e9" letter-spacing="1.7">FOUNDER  /  SOFTWARE DEVELOPER</text>
    <path d="M52 308H602" stroke="url(#line)" stroke-width="2"/>
    <text x="52" y="345" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#93a8c2">Building practical products through AKELUWA Softwarehub</text>
    <rect x="736" y="65" width="486" height="270" rx="18" fill="#08111e" stroke="#3a6379" stroke-opacity=".85"/>
    <path d="M736 110H1222" stroke="#284252"/>
    <circle cx="764" cy="88" r="7" fill="#f08085"/><circle cx="788" cy="88" r="7" fill="#f2bb70"/><circle cx="812" cy="88" r="7" fill="#56c5a3"/>
    <text x="1167" y="93" text-anchor="end" font-family="monospace" font-size="15" fill="#7e9ab2">bivek@github:~</text>
    <text x="769" y="148" font-family="monospace" font-size="21" fill="#4de1ce">$ <tspan fill="#ebeff8">whoami</tspan></text>
    <text x="769" y="178" font-family="monospace" font-size="18" fill="#bdd1e2">bivek-kumar-sah</text>
    <text x="769" y="219" font-family="monospace" font-size="21" fill="#4de1ce">$ <tspan fill="#ebeff8">cat mission.txt</tspan></text>
    <text x="769" y="248" font-family="monospace" font-size="17" fill="#d2dce8">Build <tspan fill="#ffca89">useful</tspan> software.</text>
    <text x="769" y="275" font-family="monospace" font-size="17" fill="#d2dce8">Ship <tspan fill="#78ded0">reliable</tspan> products.</text>
    <text x="769" y="308" font-family="monospace" font-size="18" fill="#51d9c8">$ <tspan fill="#eaf1fb">_</tspan></text>
    <path d="M40 370H1240" stroke="#588aa3" stroke-opacity=".28"/>
